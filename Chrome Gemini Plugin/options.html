<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Force Gemini Pro - 设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 24px;
      color: #1f2937;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .icon {
      font-size: 28px;
    }
    .subtitle {
      color: #6b7280;
      margin-bottom: 28px;
      font-size: 14px;
    }
    .section {
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 16px;
    }
    .option {
      display: flex;
      align-items: flex-start;
      padding: 16px;
      background: white;
      border-radius: 10px;
      margin-bottom: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .option:hover {
      border-color: #667eea;
    }
    .option.selected {
      border-color: #667eea;
      background: #f0f4ff;
    }
    .option:last-child {
      margin-bottom: 0;
    }
    .option input {
      margin-top: 4px;
      margin-right: 12px;
      width: 18px;
      height: 18px;
      accent-color: #667eea;
    }
    .option-content {
      flex: 1;
    }
    .option-label {
      font-weight: 600;
      color: #1f2937;
      font-size: 15px;
      margin-bottom: 4px;
    }
    .option-desc {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 8px;
    }
    .badge-easy {
      background: #dbeafe;
      color: #1d4ed8;
    }
    .badge-strict {
      background: #fef3c7;
      color: #d97706;
    }
    .save-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .status {
      text-align: center;
      padding: 10px;
      margin-top: 16px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status.success {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span class="icon">🛡️</span> Force Gemini Pro</h1>
    <p class="subtitle">智能护栏设置 - 选择最适合您的拦截模式</p>

    <div class="section">
      <div class="section-title">选择拦截模式</div>

      <label class="option selected" id="option-warning">
        <input type="radio" name="mode" value="warning" checked>
        <div class="option-content">
          <div class="option-label">
            ⚠️ 警告模式
            <span class="badge badge-easy">推荐</span>
          </div>
          <div class="option-desc">
            Fast 模型时输入框变红，按回车弹出拦截提示。<br>
            您可以选择「仍要使用 Fast」或「去切换 Pro」。<br>
            <strong>适合：想要保留灵活性的用户</strong>
          </div>
        </div>
      </label>

      <label class="option" id="option-strict">
        <input type="radio" name="mode" value="strict">
        <div class="option-content">
          <div class="option-label">
            🔒 强制 Pro 模式
            <span class="badge badge-strict">严格</span>
          </div>
          <div class="option-desc">
            Fast 模型时窗口整体变红，完全禁止发送。<br>
            必须手动切换到 Pro 才能正常发送。<br>
            <strong>适合：不想误用 Fast、追求最高质量的用户</strong>
          </div>
        </div>
      </label>
    </div>

    <button class="save-btn" id="saveBtn">💾 保存设置</button>
    <div class="status" id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
